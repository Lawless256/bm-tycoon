<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Mining Tycoon</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14181d; --panel2:#1a1f26; --edge:#2a313a; --edge2:#3a434f;
  --amber:#f7931a; --amber2:#ffb84d; --green:#4ade80; --red:#f87171; --blue:#60a5fa;
  --txt:#cfd6de; --dim:#7c8794; --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg) repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.012) 22px 24px);
  color:var(--txt); font-family:var(--mono); font-size:14px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:10px 12px 90px}
h2{font-size:15px;color:var(--amber2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;border-bottom:1px solid var(--edge);padding-bottom:6px}
h3{font-size:13px;margin-bottom:6px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:8px;padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 4px 14px rgba(0,0,0,.45);margin-bottom:12px}
#hdr{position:sticky;top:0;z-index:90;background:linear-gradient(180deg,#161b21,#101419);border-bottom:2px solid #000;box-shadow:0 3px 12px rgba(0,0,0,.6)}
#hdr .inner{max-width:1280px;margin:0 auto;padding:8px 12px;position:relative}
#minichart{display:none;position:absolute;top:6px;right:84px;width:252px;height:84px;background:#0a0d11;border:1px solid var(--edge);border-radius:5px;cursor:pointer}
@media(min-width:1200px){
  #minichart{display:block}
  #menubtn{position:absolute;top:8px;right:12px}
  #hdr .hrow,#hdr .timebar{margin-right:346px}
}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--amber);text-shadow:0 0 12px rgba(247,147,26,.5);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{background:#0d1115;border:1px solid var(--edge);border-radius:6px;padding:3px 8px;min-width:88px}
.chip .lab{font-size:8.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.chip .val{font-size:12px;font-weight:700;color:#e8eef5;white-space:nowrap}
.amber{color:var(--amber2)!important}.grn{color:var(--green)!important}.red{color:var(--red)!important}.dim{color:var(--dim)!important}
.timebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.datebox{background:#05070a;border:1px solid #2d3a26;border-radius:5px;padding:4px 12px;color:#9be88f;font-weight:700;letter-spacing:1px;text-shadow:0 0 8px rgba(120,255,120,.5)}
button{font-family:var(--mono);cursor:pointer;border-radius:5px;border:1px solid var(--edge2);
  background:linear-gradient(180deg,#2a323c,#1c2229);color:var(--txt);padding:6px 12px;font-size:12px;font-weight:700}
button:hover{border-color:var(--amber);color:var(--amber2)}
button:disabled{opacity:.35;cursor:not-allowed}
button.on{background:linear-gradient(180deg,#7a4a0e,#5a370c);border-color:var(--amber);color:#ffd9a0;box-shadow:0 0 10px rgba(247,147,26,.4)}
button.buy{border-color:#2f5d3a;background:linear-gradient(180deg,#1e3a26,#15291b);color:#8fe8a5}
button.buy:hover{border-color:var(--green)}
button.warn{border-color:#5d2f2f;background:linear-gradient(180deg,#3a1e1e,#291515);color:#e8908f}
button.sm{padding:3px 8px;font-size:11px}
input,select{font-family:var(--mono);background:#0a0d11;border:1px solid var(--edge2);color:#e8eef5;border-radius:5px;padding:6px 8px;font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--amber)}
.tabs{display:flex;gap:4px;padding:6px 0 2px;margin-top:2px;flex-wrap:wrap}
.tabs button{padding:8px 16px;text-transform:uppercase;letter-spacing:.5px}
.tabs button.act{background:linear-gradient(180deg,#4a3208,#352405);border-color:var(--amber);color:var(--amber2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:#0d1115;border:1px solid var(--edge);border-radius:6px;padding:10px 12px}
.stat .lab{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.stat .val{font-size:17px;font-weight:800;color:#eef4fa}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#333;vertical-align:1px}
.led.g{background:var(--green);box-shadow:0 0 7px var(--green)}
.led.r{background:var(--red);box-shadow:0 0 7px var(--red)}
.led.y{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:8px;background:#0a0d11;border:1px solid var(--edge);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7adf8f,#f0c050,#f87171);transition:width .3s}
.condbar i{background:linear-gradient(90deg,#f87171,#f0c050,#7adf8f)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:5px 8px;border-bottom:1px solid var(--edge)}
td{padding:7px 8px;border-bottom:1px solid #1c2128;vertical-align:middle}
.rig{background:#0d1115;border:1px solid var(--edge);border-radius:7px;padding:10px 12px;margin-bottom:8px}
.rig.off{opacity:.6}.rig.broken{border-color:#6b2222}
.tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.tag.bull{background:#10331c;color:#7adf8f;border:1px solid #1d5b30}
.tag.bear{background:#3a1515;color:#f59896;border:1px solid #6b2222}
.tag.neut{background:#23282f;color:#9aa6b3;border:1px solid #39414c}
.tag.warn{background:#3a2a08;color:#ffce7a;border:1px solid #6b4d12}
.news{max-height:520px;overflow-y:auto}
.nitem{padding:9px 6px;border-bottom:1px solid #1b2026}
.nitem .nd{color:var(--dim);font-size:10px}
.nitem .nh{font-weight:700;color:#e8eef5;margin:2px 0}
.nitem .nb{color:#9aa6b3;font-size:12px}
.nitem.major{background:linear-gradient(90deg,rgba(247,147,26,.07),transparent);border-left:3px solid var(--amber)}
#toasts{position:fixed;bottom:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:linear-gradient(180deg,#23292f,#171c21);border:1px solid var(--amber);border-radius:8px;padding:10px 14px;
  box-shadow:0 6px 20px rgba(0,0,0,.7),0 0 14px rgba(247,147,26,.25);animation:tin .3s ease}
.toast b{color:var(--amber2)}.toast .tb{font-size:12px;color:#aab6c2;margin-top:2px}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:150px}
.gauge .gl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.gauge .gv{font-size:14px;font-weight:800;color:var(--amber2)}
#chartbox{position:relative}
#chart,#exchart{width:100%;height:260px;display:block;background:#0a0d11;border:1px solid var(--edge);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:560px;width:100%;max-height:90vh;overflow-y:auto;margin:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1b2026}
.setrow label{font-size:12px;color:#aab6c2}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.icon{vertical-align:middle;margin-right:6px}
#tickerwrap{overflow:hidden;background:#07090c;border:1px solid var(--edge);border-radius:5px;margin:0 0 10px;padding:5px 0}
.tickin{display:inline-block;white-space:nowrap;animation:marq 45s linear infinite}
.tk{color:var(--amber2);margin:0 18px;font-size:12px;letter-spacing:.5px}
.tk.bear{color:#f59896}.tk.bull{color:#7adf8f}
.tksep{color:#39434f;font-size:12px}
@keyframes marq{to{transform:translateX(-50%)}}
.alertwrap{position:fixed;inset:0;z-index:400;background:rgba(2,3,5,.88);display:flex;align-items:center;justify-content:center;padding:16px;animation:tin .25s ease}
.alertbox{max-width:640px;width:100%;background:linear-gradient(180deg,#1d232b,#12161b);border:2px solid var(--amber);border-radius:10px;overflow:hidden;box-shadow:0 0 60px rgba(247,147,26,.35)}
.alertbox .abar{background:var(--amber);color:#1a1206;font-weight:800;letter-spacing:2px;padding:7px 14px;font-size:13px;text-transform:uppercase}
.alertbox .abody{padding:18px}
.alertbox h2{border:0;color:#fff;font-size:19px;margin:0 0 8px;text-transform:none;padding:0}
.alertbox .adesc{color:#aab6c2;font-size:13px;line-height:1.5}
.alertbox.red{border-color:var(--red);box-shadow:0 0 90px rgba(248,113,113,.55);background:linear-gradient(180deg,#2a1212,#170b0b)}
.alertbox.red .abar{background:var(--red);color:#2a0606}
.alertbox.pizza{border-color:#ffd24d;box-shadow:0 0 90px rgba(255,210,77,.5)}
.alertbox.pizza .abar{background:#ffd24d;color:#3a2a00}
.bigpizza{font-size:64px;text-align:center;margin:4px 0}
.pnl-pos{color:var(--green)}.pnl-neg{color:var(--red)}
.octag{background:#3a1532;color:#f0a0e8;border:1px solid #7a2a68}
.ecotag{background:#0e3325;color:#7adf8f;border:1px solid #1d5b30}
.alertbox.genesis{border-color:#3fae6a;box-shadow:0 0 90px rgba(63,174,106,.4);background:linear-gradient(180deg,#0c1410,#070d09)}
.alertbox.genesis .abar{background:#3fae6a;color:#03140a}
.genesisbody{background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,255,128,.025) 2px 4px)}
.gb-line{color:#67d98f;font-size:10.5px;word-break:break-all;margin:2px 0;text-shadow:0 0 6px rgba(60,220,120,.35)}
.gb-coinbase{color:#ffd24d;font-size:14px;font-weight:700;margin:12px 0;border:1px dashed #6b5a23;padding:10px;background:rgba(255,210,77,.05);line-height:1.5}
.gb-wp{color:#9aa6b3;font-style:italic;font-size:11.5px;margin-top:8px;line-height:1.5}
.grp{background:#0d1115;border:1px solid var(--edge);border-radius:7px;padding:10px 12px;margin-bottom:8px}
.farmview-bg{position:relative;width:100%;aspect-ratio:5/3;border-radius:8px;background:#11161c;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;overflow:hidden}
/* Home Base scene — container ratio matches the 1408x768 art so % hotspots align with no distortion */
.homescene{position:relative;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:1408/768;border-radius:8px;overflow:hidden;border:1px solid var(--edge);background:#0a0d11 center/cover no-repeat}
.homescene.placeholder{display:flex;align-items:center;justify-content:center}
.homeph{color:var(--amber2);font-weight:700;text-align:center;letter-spacing:1px;line-height:1.6}
.hh{position:absolute;cursor:pointer;border:2px solid transparent;border-radius:4px;transition:border-color .1s,background .1s}
.hh:hover{border-color:var(--amber);background:rgba(247,147,26,.16)}
.homedate{position:absolute;left:12px;bottom:10px;background:rgba(5,7,10,.82);border:1px solid #2d3a26;border-radius:4px;padding:3px 9px;color:#9be88f;font-weight:700;font-size:13px;letter-spacing:1px;text-shadow:0 0 8px rgba(120,255,120,.5)}
.homedate.br{left:auto;right:14px;bottom:8px}
.hh-bar{position:absolute;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(5,7,10,.8);border:1px solid var(--edge);border-radius:6px;padding:5px 8px;max-width:94%}
.placelayer{position:absolute;inset:0;cursor:crosshair;z-index:60;background:rgba(247,147,26,.04)}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  body{font-size:13px}
  #hdr{position:static}  /* the full header is too tall to pin on phones */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%}
  .chip{min-width:0;padding:3px 7px}
  .chip .val{font-size:11px;overflow:hidden;text-overflow:ellipsis}
  .logo{font-size:14px}
  .tabs button{padding:7px 10px;font-size:11px}
}
</style>
</head>

<script>
'use strict';
/* ============ RNG ============ */
function RNG(seed){this.s=seed>>>0;this._sp=null;}
RNG.prototype.next=function(){this.s=this.s+0x6D2B79F5|0;let t=Math.imul(this.s^this.s>>>15,1|this.s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
RNG.prototype.range=function(a,b){return a+(b-a)*this.next();};
RNG.prototype.int=function(a,b){return Math.floor(this.range(a,b+1));};
RNG.prototype.gauss=function(){let u=0,v=0;while(u===0)u=this.next();while(v===0)v=this.next();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
RNG.prototype.pick=function(a){return a[Math.floor(this.next()*a.length)];};
RNG.prototype.chance=function(p){return this.next()<p;};
function oneShot(seed){const r=new RNG(seed);r.next();r.next();return r.next();}
function poisson(lam,rng){
  if(lam<=0)return 0;
  if(lam>40)return Math.max(0,Math.round(lam+Math.sqrt(lam)*rng.gauss()));
  const L=Math.exp(-lam);let k=0,p=1;
  do{k++;p*=rng.next();}while(p>L);
  return k-1;
}
/* ============ DATES & FORMAT ============ */
const EPOCH=Date.UTC(2009,0,3);
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayOf(s){const p=s.split('-');return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-EPOCH)/864e5);}
function dateOf(day){return new Date(EPOCH+day*864e5);}
function fmtDate(day){const d=dateOf(day);return MO[d.getUTCMonth()]+' '+String(d.getUTCDate()).padStart(2,'0')+', '+d.getUTCFullYear();}
function yearOf(day){return dateOf(day).getUTCFullYear();}
function yearFrac(day){return 2009+(day+2)/365.25;}
function fmtUSD(x){const neg=x<0?'-':'';x=Math.abs(x);return neg+'$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPrice(x){
  if(x<=0)return '—';
  if(x<0.01)return '$'+x.toFixed(6);
  if(x<1)return '$'+x.toFixed(4);
  return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBigUSD(x){if(x>=1e15)return '$'+(x/1e15).toFixed(2)+'Q';if(x>=1e12)return '$'+(x/1e12).toFixed(2)+'T';if(x>=1e9)return '$'+(x/1e9).toFixed(2)+'B';if(x>=1e6)return '$'+(x/1e6).toFixed(2)+'M';return fmtUSD(x);}
function fmtBTC(x){return '₿'+x.toFixed(8);}
function fmtBTCs(x){return '₿'+(x>=1000?x.toLocaleString('en-US',{maximumFractionDigits:2}):x.toFixed(x>=1?4:8));}
const HU=['H/s','kH/s','MH/s','GH/s','TH/s','PH/s','EH/s','ZH/s','YH/s'];
function fmtHash(h){if(!h||h<=0)return '0 H/s';let i=0;while(h>=1000&&i<HU.length-1){h/=1000;i++;}return (h>=100?h.toFixed(0):h.toFixed(2))+' '+HU[i];}
function fmtNum(x){if(x>=1e15)return (x/1e15).toFixed(2)+'P';if(x>=1e12)return (x/1e12).toFixed(2)+'T';if(x>=1e9)return (x/1e9).toFixed(2)+'G';if(x>=1e6)return (x/1e6).toFixed(2)+'M';if(x>=1e3)return (x/1e3).toFixed(2)+'k';return x.toFixed(x<10?2:0);}
function fmtWatts(w){return w>=1e6?(w/1e6).toFixed(2)+' MW':w>=1000?(w/1000).toFixed(2)+' kW':w.toFixed(0)+' W';}
function fmtDur(days){
  if(!isFinite(days))return 'never';
  if(days<1/24/60)return '<1 min';
  if(days<1/24)return Math.round(days*1440)+' min';
  if(days<1)return (days*24).toFixed(1)+' hrs';
  if(days<60)return days.toFixed(1)+' days';
  if(days<730)return (days/30.44).toFixed(1)+' months';
  return (days/365.25).toFixed(1)+' years';
}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function el(id){return document.getElementById(id);}
/* ============ HARDWARE CATALOGS ============ */
const CPUS=[
  {id:'cpu1',name:'Beige Box Home PC',hash:5e6,watts:120,price:350,from:dayOf('2009-01-03')},
  {id:'cpu2',name:'Gaming Tower (Quad Core)',hash:18e6,watts:300,price:850,from:dayOf('2009-01-03')},
  {id:'cpu3',name:'Dual-Xeon Server Node',hash:45e6,watts:550,price:2400,from:dayOf('2009-06-01')},
];
// cu = "compute units": earning power on ETH (pre-merge) and AI-compute marketplaces. sha256 hash is for BTC mining only.
const GPUS=[
  {id:'g1',name:'Radiant HD 4850',hash:110e6,watts:130,price:180,from:dayOf('2010-07-18'),cu:0.2},
  {id:'g2',name:'Radiant HD 5870',hash:400e6,watts:190,price:380,from:dayOf('2010-07-18'),cu:0.4},
  {id:'g3',name:'Radiant HD 5970 (dual)',hash:640e6,watts:300,price:620,from:dayOf('2010-11-01'),cu:0.6},
  {id:'g4',name:'Radiant HD 6990 (dual)',hash:760e6,watts:375,price:710,from:dayOf('2011-03-08'),cu:0.7},
  {id:'g5',name:'Radiant HD 7970',hash:680e6,watts:230,price:550,from:dayOf('2012-01-09'),cu:1},
  {id:'g6',name:'GFX 1070',hash:1.0e9,watts:150,price:380,from:dayOf('2016-06-10'),cu:3},
  {id:'g7',name:'GFX 1080 Ti',hash:1.8e9,watts:250,price:700,from:dayOf('2017-03-10'),cu:5},
  {id:'g8',name:'GFX 2080',hash:2.0e9,watts:215,price:700,from:dayOf('2018-09-20'),cu:7},
  {id:'g9',name:'GFX 3080',hash:2.5e9,watts:320,price:700,from:dayOf('2020-09-17'),cu:12},
  {id:'g10',name:'GFX 4090 (AI)',hash:3.0e9,watts:450,price:1600,from:dayOf('2022-10-12'),cu:25},
  {id:'g11',name:'GFX 5090 (AI)',hash:3.5e9,watts:575,price:2000,from:dayOf('2025-01-30'),cu:45},
  {id:'g12',name:'TensorRig TX100',hash:4.0e9,watts:700,price:3500,from:dayOf('2027-06-01'),cu:85},
  {id:'g13',name:'TensorRig TX200',hash:4.5e9,watts:800,price:5200,from:dayOf('2030-01-01'),cu:150},
];
/* —— GPU side-hustles: ETH mining (until the Merge) and AI compute rental, both paying out in BTC —— */
const ETH_START=dayOf('2016-01-15'), MERGE_DAY=dayOf('2022-09-15'), AI_START=dayOf('2022-12-01');
function ethRate(day){ // BTC per CU per day — calibrated so a 6-card modern rig tracks S19-class profitability pre-merge
  if(day<ETH_START||day>=MERGE_DAY)return 0;
  const A=[[ETH_START,4e-5],[dayOf('2017-06-15'),1.3e-4],[dayOf('2017-12-15'),1.5e-4],[dayOf('2019-01-15'),2.5e-5],[dayOf('2020-06-01'),1.2e-5],[dayOf('2021-05-01'),1.1e-5],[MERGE_DAY,6e-6]];
  for(let i=0;i<A.length-1;i++){
    if(day>=A[i][0]&&day<A[i+1][0]){
      const f=(day-A[i][0])/(A[i+1][0]-A[i][0]);
      return Math.pow(10,Math.log10(A[i][1])*(1-f)+Math.log10(A[i+1][1])*f);
    }
  }
  return A[0][1];
}
function aiRate(day){ // BTC per CU per day — AI boom ramps, then matures into steady growth

// "Unpaired timeline": same long-term trajectory, but cycle timing/peaks/crashes are pure seed — history is ignored
function unpairedCycle(day,seed){
  if(day<MARKET_OPEN)return 1;
  let start=MARKET_OPEN,i=0,len=900;
  for(let guard=0;guard<300;guard++){
    len=Math.round(850+oneShot(seed^(i*7919+13))*1100);
    if(day<start+len)break;
    start+=len;i++;
  }
  const phase=(day-start)/len;
  let amp=(i<1?9:4.5*Math.pow(0.9,i))*(0.45+1.1*oneShot(seed^(i*271+7)));
  amp=Math.max(0.3,amp);
  const peak=0.2+0.5*oneShot(seed^(i*613+3));
  const wP=0.06+0.06*oneShot(seed^(i*97+11));
  const trough=Math.min(0.95,peak+0.25+0.25*oneShot(seed^(i*431+5)));
  const depth=0.3+0.3*oneShot(seed^(i*887+9));
  const gp=Math.exp(-Math.pow(phase-peak,2)/(2*wP*wP));
  const gt=Math.exp(-Math.pow(phase-trough,2)/(2*0.12*0.12));
  return (1+amp*gp)*(1-depth*gt);
}
function cycleMult(day,seed){
  if(day<MARKET_OPEN)return 1;
  if(typeof S!=='undefined'&&S&&S.set&&S.set.unpaired)return unpairedCycle(day,seed);
  let n=0;while(halvingDay(n)<=day)n++;          // cycle n: from halving n-1 (or genesis) to halving n
  const start=n===0?0:halvingDay(n-1), end=halvingDay(n);
  const phase=(day-start)/(end-start);
  const AMPS=[14,4.2,3.3,1.25,0.65];
  let amp=n<AMPS.length?AMPS[n]:Math.max(0.35,0.6*Math.pow(0.92,n-4));
  amp*=0.8+0.5*oneShot(seed+n*977);
  const peak=n===0?0.62:0.28+0.12*oneShot(seed+n*311);
  const depth=0.4+0.15*oneShot(seed+n*523);
  const trough=Math.min(0.93,peak+0.42);
  // cycles compress as the asset matures: narrower, shallower swings each era
  const wP=0.085*Math.pow(0.97,n), wT=0.13*Math.pow(0.98,n);
  const gp=Math.exp(-Math.pow(phase-peak,2)/(2*wP*wP));
  const gt=Math.exp(-Math.pow(phase-trough,2)/(2*wT*wT));
  return (1+amp*gp)*(1-depth*Math.pow(0.96,Math.max(0,n-4))*gt);
}

function defaultSettings(){

function buildSchedule(seed){
  const r=new RNG(seed^0x5EEDFACE);
  const evs=[];
  for(const e of SCRIPT_EVENTS){
    const base=dayOf(e[0]);
    // every run shifts history: ±10-15% style timing jitter (anchor events shift less)
    let d=base+Math.round(clamp(r.gauss()*(e[5]?8:18),-50,50));
    if(base===0)d=0;
    evs.push({day:Math.max(0,d),head:e[1],desc:e[2],imp:e[3],fx:e[4],maj:e[6]||0});
    if(e[4]&&e[4].t==='hackS'){
      evs.push({day:Math.max(0,d-6),head:'Withdrawal Delays at a Major Exchange',
        desc:'Users report stuck withdrawals and vague "maintenance" notices. Security researchers voice concerns. If you hold coins on an exchange, think hard.',
        imp:'bear',fx:null});
    }
  }
  evs.sort((a,b)=>a.day-b.day);
  return evs;
}

  const f=S.set.hackFreq;

/* ============ RIG HELPERS ============ */
function rigModel(r){return findModel(r.model);}
function rigName(r){
  if(r.kind==='gpu')return 'GPU Rig #'+r.id+' ('+r.cards.length+'/'+PSU_TIERS[r.psu].cards+' cards)';
  return rigModel(r).name+' #'+r.id;
}
function rigHashMax(r){
  if(r.kind==='gpu')return r.cards.reduce((s,c)=>s+findModel(c).hash,0);
  return rigModel(r).hash;
}
// model-specific overclock headroom: hash gain / power gain
function ocFactors(r){
  if(r.kind==='cpu')return {h:1.05,p:1.12};   // minimal CPU headroom
  if(r.kind==='gpu')return {h:1.15,p:1.30};   // 10-20% hash, big heat/power jump
  return {h:1.13,p:1.18};                     // ASIC: e.g. S9 13.5 -> ~15.3 TH/s @ ~1560W
}
// underclock: efficiency mode — small hash loss, big power saving, gentler wear
function ucFactors(r){
  if(r.kind==='cpu')return {h:0.95,p:0.88};
  if(r.kind==='gpu')return {h:0.85,p:0.68};
  return {h:0.85,p:0.70};                     // ASIC: J/TH improves ~18%
}
function clkF(r){return r.clk===1?ocFactors(r):r.clk===-1?ucFactors(r):{h:1,p:1};}
function hasCooling(r){
  const f=getFarm(r.farmId);
  return (f&&(f.coolTier||0)>=1)||(r.kind==='gpu'&&r.cool>=1);
}
function rigHash(r){
  if(r.broken||!r.online||!r.conn)return 0;
  return rigHashMax(r)*(0.55+0.45*r.cond)*clkF(r).h;
}
function rigMining(r){return r.online&&!r.broken&&r.conn;}
function rigWatts(r){
  const base=r.kind==='gpu'?60+r.cards.reduce((s,c)=>s+findModel(c).watts,0):rigModel(r).watts;
  return base*clkF(r).p;
}
function rigInvested(r){
  if(r.kind==='gpu')return r.invested;
  return rigModel(r).price;
}
function bestEff(){ // best available efficiency hash/watt for obsolescence calc
  let best=0;
  for(const m of [].concat(CPUS,GPUS,ASICS))if(m.from<=S.day)best=Math.max(best,m.hash/m.watts);
  return best;
}
function rigResale(r){
  const inv=rigInvested(r)||1;
  const hash=rigHashMax(r);if(hash<=0)return Math.round(inv*0.3);
  const eff=hash/rigWatts(r);
  const obs=Math.min(1,Math.pow(eff/bestEff(),0.55));
  const age=(S.day-r.bought)/365.25;
  return Math.max(5,Math.round(inv*0.55*r.cond*Math.pow(0.85,age)*Math.max(0.08,obs)));
}
function farmRigs(fid){return S.rigs.filter(r=>r.farmId===fid);}
function farmHash(f){return farmRigs(f.id).reduce((s,r)=>s+rigHash(r),0);}
function farmCU(f){return farmRigs(f.id).reduce((s,r)=>s+cuOfRig(r),0);}
function farmMode(f){return f.mode||'solo';}
function soloHashTotal(){return S.farms.reduce((s,f)=>{
  const m=farmMode(f);
  if(m==='solo')return s+farmHash(f);
  if(m==='eth'||m==='ai'||m==='aiusd')return s;
  return POOLS.some(p=>p.id===m&&p.from<=S.day)?s:s+farmHash(f); // pool not open yet -> mines solo
},0);}
function farmWattsInstalled(f){return farmRigs(f.id).reduce((s,r)=>s+rigWatts(r),0);}
function farmWattsActive(f){return farmRigs(f.id).reduce((s,r)=>s+((r.online&&!r.broken)?rigWatts(r):0),0);}
function playerHash(){return S.rigs.reduce((s,r)=>s+rigHash(r),0);}
function playerHashMax(){return S.rigs.reduce((s,r)=>s+rigHashMax(r),0);}
function totalActiveWatts(){return S.farms.reduce((s,f)=>s+farmWattsActive(f),0);}
function networkOthers(){return Math.pow(10,S.netLog)*S.hashMod;}
function networkTotal(){return networkOthers()+playerHash();}
function dailyPowerCost(){return S.farms.reduce((s,f)=>s+farmWattsActive(f)/1000*24*f.rate*S.set.powerMod,0);}
function curReward(){return rewardForEra(S.rewardEra);}
function curFee(){const t=trendPrice(S.day);return feePerBlock(S.day,t>0?S.price/t:1);}
function expectedDailyBTC(){
  const nt=networkTotal();let total=0;
  for(const f of S.farms){
    const mode=farmMode(f);
    if(mode==='eth')total+=farmCU(f)*ethRate(S.day)*0.98;
    else if(mode==='ai')total+=farmCU(f)*aiRate(S.day)*0.98;
    else if(mode==='aiusd')total+=farmCU(f)*aiRate(S.day)*0.99; // paid in USD; BTC-equivalent shown
    else{
      const fh=farmHash(f);if(fh<=0||nt<=0)continue;
      const p=mode==='solo'?null:POOLS.find(x=>x.id===mode&&x.from<=S.day);
      total+=fh/nt*144*(curReward()+curFee())*S.set.luck*(p?1-p.fee:1);
    }
  }
  return total;
}
function hwValue(){return S.rigs.reduce((s,r)=>s+rigResale(r),0);}
// property appreciates ~3-4%/yr regardless of BTC; better locations a touch faster
function farmValue(f){
  const t=FARM_TYPES.find(x=>x.id===f.typeId);
  if(!t||t.cost<=0)return 0;
  const years=Math.max(0,(S.day-(f.bought||0))/365.25);
  const rate=0.033+0.004*(FARM_TYPES.indexOf(t)/(FARM_TYPES.length-1));
  return Math.round(t.cost*Math.pow(1+rate,years));
}
function propValue(){return S.farms.reduce((s,f)=>s+farmValue(f),0);}
function netWorth(){return S.cash+(S.wallet+S.exch)*S.price+hwValue()+propValue();}

/* ============ SIMULATION: ONE DAY ============ */
function stepDay(){
  S.day++;
  const day=S.day, date=dateOf(day), prevDate=dateOf(day-1);
  extendAsics(day);
  /* --- new hardware hits the market --- */
  for(const m of [].concat(CPUS,GPUS,ASICS)){
    if(m.from<=day&&!S.seenHw.includes(m.id)){
      S.seenHw.push(m.id);
      const kind=CPUS.includes(m)?'CPU miner':GPUS.includes(m)?'GPU card':'ASIC miner';
      pushNews(day,'🛒 New Hardware: '+m.name,'New '+kind+' available in the shop — '+fmtHash(m.hash)+' at '+fmtWatts(m.watts)+' for '+fmtUSD(m.price)+' ('+effStr(m)+').','neut',false);
      if(S.set.notifHw)toast('🛒 New in Shop',m.name+' — '+fmtHash(m.hash)+' for '+fmtUSD(m.price));
    }
  }
  /* --- global blocks & halvings --- */
  const blocksToday=Math.max(100,Math.round(146+rng.gauss()*8));
  const reward=curReward();
  S.totalBlocks+=blocksToday;
  S.supply=Math.min(21e6,S.supply+blocksToday*reward);
  S.sinceAdjust+=blocksToday;
  const era=Math.floor(S.totalBlocks/210000);
  if(era>S.rewardEra&&S.rewardEra<34){
    S.rewardEra=era;
    const nr=rewardForEra(era);
    if(nr>0){
      pushNews(day,'⚡ HALVING #'+era+' — Block Reward Now '+nr+' BTC','Block '+ (era*210000).toLocaleString()+' mined. Subsidy cut in half. Miner margins compress; scarcity narrative ignites.','bull',true);
      queueAlert({kind:'news',head:'⚡ HALVING #'+era,body:'Block '+(era*210000).toLocaleString()+' has been mined. The block reward just dropped to '+nr+' BTC. Half the new supply, same demand — you know how this story goes. Check that your fleet is still profitable.',imp:'bull'});
      if(S.rigs.some(r=>r.online&&!r.broken))milestone('halv'+era,'Survived Halving #'+era,'Your operation kept hashing through the subsidy cut.');
    }else{
      pushNews(day,'⚡ THE FINAL HALVING — Block Subsidy Reaches Zero','All 21,000,000 BTC have effectively been issued. From here on, miners live on transaction fees alone.','neut',true);
      queueAlert({kind:'news',head:'⚡ THE LAST SATOSHI',body:'The block subsidy has reached zero. All 21,000,000 BTC are issued. From this block forward, miners are paid in transaction fees alone — and you\'re still here.',imp:'neut'});
    }
  }
  /* --- difficulty adjustment --- */
  if(S.sinceAdjust>=2016){
    S.sinceAdjust-=2016;
    const newDiff=Math.max(1,networkTotal()/7.16e6);
    const chg=S.difficulty>0?(newDiff/S.difficulty-1)*100:0;
    S.difficulty=newDiff;
    if(Math.abs(chg)>8&&day-S.lastDiffNews>56){
      S.lastDiffNews=day;
      pushNews(day,'Difficulty Adjusts '+(chg>0?'+':'')+chg.toFixed(1)+'%','Network difficulty is now '+fmtNum(newDiff)+'. '+(chg>0?'More competition for every block.':'Easier blocks for survivors.'),chg>0?'bear':'bull',false);

function genYearEvents(y){
  const r=new RNG(S.set.seed^(y*2654435761));
  // era-appropriate story pools: regulation -> hyperbitcoinization -> futuristic -> mature macro
  const pool=y<2028?EV_TEMPLATES:
             y<2032?EV_2028.concat(EV_FLAVOR):
             y<2050?EV_2032.concat(EV_FLAVOR):
             EV_2050.concat(EV_FLAVOR);
  const n=3+Math.floor(r.next()*3);
  for(let i=0;i<n;i++){
    const t=pool[Math.floor(r.next()*pool.length)];
    const place=EV_PLACES[Math.floor(r.next()*EV_PLACES.length)];
    const d=dayOf(y+'-01-15')+Math.floor(r.next()*330);
    S.events.push({day:d,head:t[0].replace('{C}',place),desc:t[1].replace('{C}',place),imp:t[2],fx:t[3]!==1?{t:'shock',v:t[3]}:null});
  }
  S.events.sort((a,b)=>a.day-b.day);
  // re-find index: keep events not yet fired in order
  S.evIdx=S.events.findIndex(e=>e.day>S.day-1);
  if(S.evIdx<0)S.evIdx=S.events.length;

function computeTemp(){

  for(const f of S.farms){const w=farmWattsActive(f);if(w>0){load+=w/(f.capKW*1000);nf++;}}
  if(nf===0)return 35;
  return 36+48*(load/nf)+Math.sin(S.day*0.7)*1.5;
}

    const L=S.loans[i];

    if(S.cash>=pay){
      S.cash-=pay;L.bal=L.bal+interest-pay;L.left--;

      let owed=L.bal+interest,recovered=0;
      const sorted=S.rigs.slice().sort((a,b)=>rigResale(b)-rigResale(a));

      }

  if(farmRigs(f.id).length>=f.slots)return 'No free rack slots at '+f.name+'.';
  if(farmWattsInstalled(f)+extraW>f.capKW*1000)return f.name+' lacks power capacity ('+fmtWatts(f.capKW*1000)+' max). Upgrade it or pick another site.';

  const slotsFree=f.slots-farmRigs(f.id).length;
  const powFree=f.capKW*1000-farmWattsInstalled(f);
  return Math.min(want,slotsFree,Math.floor(powFree/Math.max(1,unitWatts)),Math.floor(S.cash/unitPrice));

A.openPos=function(){
  if(!S.futuresOn)return;
  const dir=S.ui_fdir==='short'?-1:1;
  const margin=+(el('fmargin')?el('fmargin').value:0);   // BTC collateral
  const lev=+(el('flev')?el('flev').value:10);
  const stop=+(el('fstop')?el('fstop').value:0)||null;
  if(!(margin>=0.001))return err('Minimum margin is ₿0.00100000.');
  if(margin>S.exch+1e-12)return err('Margin is posted from your EXCHANGE balance only — you have '+fmtBTC(S.exch)+' there. Deposit BTC from your wallet first.');
  const stopPct=stop; // input is % of margin to risk
  if(stopPct&&(stopPct<1||stopPct>=95))return err('Stop-loss must be between 1 and 94 (% of margin lost).');
  const entry=S.price*(1+0.0005*dir);
  const liq=dir>0?entry*(1-0.95/lev):entry*(1+0.95/lev);
  // a X% margin loss at L× leverage = X/L % adverse price move
  const stopPrice=stopPct?(dir>0?entry*(1-stopPct/100/lev):entry*(1+stopPct/100/lev)):null;
  S.exch-=margin;
  S.positions.push({id:S.nextPosId++,dir,lev,margin,margin0:margin,entry,liq,stop:stopPrice,stopPct:stopPct||null,opened:S.day,btc:1});
  logTrade('perp-open','OPEN '+(dir>0?'LONG':'SHORT')+' '+lev+'× · margin '+fmtBTC(margin)+' · entry '+fmtPrice(entry)+(stopPct?' · stop −'+stopPct+'%':''));
  toast('📈 Perp Opened',(dir>0?'LONG':'SHORT')+' '+lev+'× · '+fmtBTC(margin*lev)+' notional · liq at '+fmtPrice(liq)+(stopPrice?' · stop '+fmtPrice(stopPrice):''));
  saveGame();render();flushToasts();
};
A.closePos=function(id){

  const P=S.positions[i];
  const pnl=Math.max(-P.margin,P.margin0*P.lev*(S.price/P.entry-1)*P.dir);
  S.exch+=Math.max(0,P.margin+pnl);
  S.perpPnl+=pnl;
  S.positions.splice(i,1);
  logTrade('perp-close','CLOSE '+(P.dir>0?'LONG':'SHORT')+' '+P.lev+'× @ '+fmtPrice(S.price)+' (entry '+fmtPrice(P.entry)+')',pnl);

function loanAPR(){const y=yearFrac(S.day);return y<2014?0.12:y<2020?0.09:0.06;}
function creditLimit(){return Math.max(2000,Math.round(netWorth()*0.4));}
A.takeLoan=function(){
  if(!S.set.loansOn)return err('Loans disabled in settings.');
  if(S.day<S.creditFreeze)return err('Credit frozen until '+fmtDate(S.creditFreeze)+'.');
  const amt=parseFloat(el('loanamt').value);
  const months=+el('loanterm').value;
  if(!(amt>0))return err('Enter an amount.');
  if(amt>creditLimit())return err('Credit limit is '+fmtUSD(creditLimit())+'.');
  const r=loanAPR()/12;
  const pay=amt*r/(1-Math.pow(1+r,-months));
  S.loans.push({bal:amt,rate:loanAPR(),pay,left:months});
  S.cash+=amt;
  pushNews(S.day,'Loan Originated',fmtUSD(amt)+' at '+(loanAPR()*100).toFixed(0)+'% APR over '+months+' months. Payment: '+fmtUSD(pay)+'/mo. Don\'t miss one.','neut',false);
  toast('🏦 Loan Funded',fmtUSD(amt)+' — '+fmtUSD(pay)+'/mo for '+months+' months');
  saveGame();render();flushToasts();
};
A.payLoan=function(i){
  const L=S.loans[i];if(!L)return;
  if(S.cash<L.bal)return err('Paying this off costs '+fmtUSD(L.bal)+'.');
  if(!confirm('Pay off this loan early?\n\nRemaining balance: '+fmtUSD(L.bal)+'\n(You skip all future interest — about '+fmtUSD(Math.max(0,L.pay*L.left-L.bal))+' saved.)'))return;
  S.cash-=L.bal;S.loans.splice(i,1);
  pushNews(S.day,'Loan Settled Early','Remaining balance of '+fmtUSD(L.bal)+' paid in full. The bank is disappointed in your fiscal responsibility.','neut',false);
  toast('🏦 Loan Paid Off',fmtUSD(L.bal)+' settled — debt-free on this one.');
  saveGame();render();flushToasts();
};
A.payBill=function(){
  if(S.unpaidBill<=0)return;
  if(S.cash<S.unpaidBill)return err('Need '+fmtUSD(S.unpaidBill)+' to restore power.');
  S.cash-=S.unpaidBill;S.unpaidBill=0;

const SAVE_KEY='btc_tycoon_v1';
function saveGame(){
  if(!S)return;
  S.rngS=rng.s;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s||s.v!==1)return false;
    S=s;rng=new RNG(1);rng.s=S.rngS|0;
    for(const r of S.rigs){if(r.conn===undefined)r.conn=r.online;if(r.clk===undefined)r.clk=r.oc?1:0;delete r.oc;}
    if(S.feeRate===undefined){S.feeRate=1;S.volEMA=0;}
    if(S.nextFud===undefined){S.nextFud=S.day+60;S.fudN=0;}
    if(S.set.unpaired===undefined)S.set.unpaired=false;
    for(const f of S.farms){if(f.bought===undefined)f.bought=0;if(f.coolTier===undefined)f.coolTier=0;}
    if(S.pool===undefined)S.pool=null;
    for(const f of S.farms)if(f.mode===undefined)f.mode=S.pool||'solo'; // old global pool -> per-farm
    if(!S.limitOrders)S.limitOrders=[];
    if(!S.positions)S.positions=[];
    if(S.futuresOn===undefined)S.futuresOn=S.day>=dayOf('2017-12-10');
    if(!S.nextPosId)S.nextPosId=1;
    if(!S.alertQueue)S.alertQueue=[];
    if(S.lastBlockDay===undefined)S.lastBlockDay=null;
    if(!S.priceMil)S.priceMil={};
    if(S.lastCrash===undefined)S.lastCrash=-999;
    if(!S.poolEarned)S.poolEarned=0;
    for(const ev of S.events)if(ev.maj===undefined)ev.maj=0;
    if(S.tab==='fut')S.tab='exch';
    // legacy USD-margined futures positions: refund margin to cash, BTC perps only now
    if(S.positions.length&&!S.positions[0].btc){for(const P of S.positions)S.cash+=P.margin;S.positions=[];}
    if(!S.tradeLog)S.tradeLog=[];
    if(S.perpPnl===undefined)S.perpPnl=0;
    if(S.spotBuyUsd===undefined){S.spotBuyUsd=0;S.spotSellUsd=0;}
    for(const k of ['notifMajor','notifHack','notifHw','notifBlocks','notifMile'])if(S.set[k]===undefined)S.set[k]=true;
    extendAsics(S.day);
    if(!S.seenHw)S.seenHw=[].concat(CPUS,GPUS,ASICS).filter(m=>m.from<=S.day).map(m=>m.id);
    return true;
  }catch(e){return false;}
}

      if(!s||s.v!==1||typeof s.day!=='number')throw 0;
      S=s;rng=new RNG(1);rng.s=S.rngS|0;

      saveGame();A.closeModal();render();
      toast('💾 Save Imported','Welcome back to '+fmtDate(S.day));flushToasts();

  if(expanded){

A.toggleGx=function(gid){S.ui_gx=S.ui_gx||{};S.ui_gx[gid]=!S.ui_gx[gid];render();};
A.grpAct=function(gid,act){
  const ids=window._grp[gid];if(!ids)return;
  const idset=new Set(ids);
  const list=S.rigs.filter(r=>idset.has(r.id));
  if(!list.length)return;
  if(act==='on')list.forEach(r=>{if(!r.broken)r.online=true;});
  else if(act==='off')list.forEach(r=>r.online=false);
  else if(act==='link')list.forEach(r=>{if(!r.broken)r.conn=true;});
  else if(act==='repair'){
    const broken=list.filter(r=>r.broken);
    const total=broken.reduce((s,r)=>s+Math.max(10,Math.round(rigInvested(r)*0.12)),0);
    if(S.cash<total)return err('Repairs cost '+fmtUSD(total)+'.');
    if(!confirm('Repair '+broken.length+' rigs for '+fmtUSD(total)+'?'))return;
    for(const r of broken){S.cash-=Math.max(10,Math.round(rigInvested(r)*0.12));r.broken=false;r.cond=Math.min(0.95,r.cond+0.35);}
  }
  else if(act==='sell'){
    const total=list.reduce((s,r)=>s+rigResale(r),0);
    if(!confirm('Sell all '+list.length+' rigs in this group for '+fmtUSD(total)+'?'))return;
    S.cash+=total;S.rigs=S.rigs.filter(r=>!idset.has(r.id));
  }
  else if(act==='oc'||act==='uc'||act==='std'){
    const mode=act==='oc'?1:act==='uc'?-1:0;
    let blocked=0;
    for(const r of list){if(!r.broken&&!setRigClk(r,mode))blocked++;}
    if(blocked)toast('⚠ Capacity Limit',blocked+' rigs couldn\'t overclock — farm power maxed.');
  }
  saveGame();render();flushToasts();
};

A.placeDown=function(e){
  const r=e.currentTarget.getBoundingClientRect();
  window._place={r,x0:e.clientX,y0:e.clientY};
  e.preventDefault();
  document.addEventListener('mousemove',placeMoveH);
  document.addEventListener('mouseup',placeUpH);
};
function placeMoveH(e){
  const p=window._place;if(!p)return;
  const x=Math.min(p.x0,e.clientX),y=Math.min(p.y0,e.clientY),w=Math.abs(e.clientX-p.x0),h=Math.abs(e.clientY-p.y0);
  let box=el('placebox');
  if(!box){box=document.createElement('div');box.id='placebox';box.style.cssText='position:fixed;border:2px solid #ffce7a;background:rgba(247,147,26,.18);pointer-events:none;z-index:500';document.body.appendChild(box);}
  box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
  const pc=v=>Math.round(v*10)/10;
  const out='{x:'+pc((x-p.r.left)/p.r.width*100)+', y:'+pc((y-p.r.top)/p.r.height*100)+', w:'+pc(w/p.r.width*100)+', h:'+pc(h/p.r.height*100)+'}';
  const ro=el('placeout');if(ro)ro.textContent=out;
}
function placeUpH(){
  document.removeEventListener('mousemove',placeMoveH);
  document.removeEventListener('mouseup',placeUpH);
  const box=el('placebox');if(box)box.remove();
}

/* async image presence check, cached so re-renders don't re-probe or flicker */
const IMG_STATUS={};
function probeImg(url){
  if(IMG_STATUS[url])return IMG_STATUS[url];          // 'ok' | 'missing'
  if(!IMG_STATUS['_probing_'+url]){
    IMG_STATUS['_probing_'+url]=1;
    const im=new Image();
    im.onload=()=>{IMG_STATUS[url]='ok';if(S&&S.tab==='home')render();};
    im.onerror=()=>{IMG_STATUS[url]='missing';if(S&&S.tab==='home')render();};
    im.src=url;
  }
  return 'loading';
}

/* ============ CHART ============ */
function drawChart(id){
  const cv=el(id||'chart');if(!cv||cv.clientWidth<10)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight||260;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const range=S.ui_range||'1Y';
  const spans={'3M':91,'1Y':365,'5Y':1826,'ALL':1e9};
  const minDay=S.day-spans[range];
  let data=S.priceHistory.filter(p=>p[0]>=minDay);
  if(data.length<2){ctx.fillStyle='#5a6672';ctx.font='12px monospace';ctx.fillText('Awaiting market data…',14,H/2);return;}
  if(data.length>800){const k=Math.ceil(data.length/800);data=data.filter((p,i)=>i%k===0||i===data.length-1);}
  const log=!!S.ui_log;
  const ys=data.map(p=>log?Math.log10(p[1]):p[1]);
  let ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
  if(ymax-ymin<1e-9){ymax+=1;ymin-=1;}
  const pad=(ymax-ymin)*0.08;ymin-=pad;ymax+=pad;
  const x0=data[0][0],x1=data[data.length-1][0];
  const X=d=>8+(W-16)*(d-x0)/Math.max(1,x1-x0);
  const Y=v=>H-18-(H-30)*((log?Math.log10(v):v)-ymin)/(ymax-ymin);
  // grid
  ctx.strokeStyle='#1a2026';ctx.lineWidth=1;ctx.fillStyle='#5a6672';ctx.font='10px monospace';
  for(let i=0;i<=4;i++){
    const gy=12+(H-30)*i/4;
    ctx.beginPath();ctx.moveTo(8,gy);ctx.lineTo(W-8,gy);ctx.stroke();
    const v=ymax-(ymax-ymin)*i/4;
    const pv=log?Math.pow(10,v):v;
    ctx.fillText(pv>=1000?'$'+fmtNum(pv):fmtPrice(pv),12,gy-3);
  }
  // line + fill
  ctx.beginPath();
  data.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.strokeStyle='#f7931a';ctx.lineWidth=1.6;ctx.shadowColor='rgba(247,147,26,.5)';ctx.shadowBlur=6;ctx.stroke();
  ctx.shadowBlur=0;
  ctx.lineTo(X(x1),H-18);ctx.lineTo(X(x0),H-18);ctx.closePath();
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(247,147,26,.22)');grad.addColorStop(1,'rgba(247,147,26,0)');
  ctx.fillStyle=grad;ctx.fill();
  // x labels
  ctx.fillStyle='#5a6672';
  ctx.fillText(fmtDate(x0),10,H-5);
  const lbl=fmtDate(x1);ctx.fillText(lbl,W-10-ctx.measureText(lbl).width,H-5);
}
/* ============ MASTER RENDER ============ */
function render(){
  if(!S)return;
  renderHeader();renderTabs();updateTicker();
  const main=el('main');
  const ae=document.activeElement;
  if(ae&&main.contains(ae)&&ae.tagName==='INPUT')return; // don't clobber typing
  switch(S.tab){
    case 'home':main.innerHTML=renderHome();break;
    case 'dash':main.innerHTML=renderDash();drawChart();break;
    case 'rigs':main.innerHTML=renderRigs();break;
    case 'shop':main.innerHTML=renderShop();break;
    case 'farms':main.innerHTML=renderFarms();break;
    case 'exch':main.innerHTML=renderExch();drawChart('exchart');A.prevTrade();break;
    case 'bank':main.innerHTML=renderBank();break;
    case 'news':main.innerHTML=renderNews();break;
  }
}
window.addEventListener('resize',()=>{if(!S)return;if(S.tab==='dash')drawChart();if(S.tab==='exch')drawChart('exchart');});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();S.speed=S.speed==='pause'?'day':'pause';renderTimebar();
  }
});
